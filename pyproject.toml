[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flowviz"
version = "0.1.0"
description = "Create flow animations"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Maurice Marx", email = "momomarx@gmail.com"}
]
requires-python = ">=3.7"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy",
    "matplotlib",
    "imageio",
]

[project.urls]
Homepage = "https://github.com/marximus/flowviz"
Repository = "https://github.com/marximus/flowviz"
"Bug Tracker" = "https://github.com/marximus/flowviz/issues"

[tool.setuptools]
packages = ["flowviz"]
